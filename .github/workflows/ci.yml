name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned Anthropic API model id (not the CLI alias `haiku`).
  LIVE_EVAL_MODEL: claude:claude-haiku-4-5-20251001

jobs:
  test-unit:
    name: test-unit (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Match `requires-python` in skills/pyproject.toml.
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: skills
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: skills/uv.lock

      - name: Pin Python ${{ matrix.python-version }}
        run: uv python pin ${{ matrix.python-version }}

      - name: Run fast unit suite
        run: make test-unit

  eval:
    name: eval (claude-haiku-4-5-20251001)
    runs-on: ubuntu-latest
    needs: test-unit
    defaults:
      run:
        working-directory: skills
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: skills/uv.lock

      - name: Pin Python 3.12
        run: uv python pin 3.12

      - name: Install Claude Code CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Claude CLI
        run: claude --version

      # The Makefile's `eval` target resolves CURSOR_API_KEY via sh-keyring;
      # the claude backend only needs ANTHROPIC_API_KEY and `claude` on PATH.
      - name: Run live evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          uv run pytest \
            dependency-injection/evals \
            extraction-for-clarity/evals \
            functional-core-imperative-shell/evals \
            -m live_eval \
            --live-eval-model "$LIVE_EVAL_MODEL" \
            --live-eval-min-trials 0 \
            --live-eval-max-trials 21 \
            --live-eval-target-rate "$(awk 'BEGIN{print 2/3}')" \
            --live-eval-concurrency 5 \
            --live-eval-failure-max-chars=0 \
            --live-eval-isolate
