[pytest]
# Use importlib mode so per-skill `tests/test_skill.py` files don't
# collide on the module name `test_skill` when pytest is invoked
# against multiple skill test directories in a single run. The default
# `prepend` mode requires unique basenames or `__init__.py` files;
# neither is desirable for this layout. See
# https://docs.pytest.org/en/stable/explanation/pythonpath.html
#
# consider_namespace_packages lets the per-skill eval dirs be collected
# together in one session. Each `evals` dir has no `__init__.py`, so pytest
# names its modules by the full path from this rootdir
# (`<skill>.evals._assertions`); paired with the relative sibling imports in
# those modules (`from ._assertions import ...`), the per-skill `_assertions`
# is namespaced per skill instead of colliding on a bare `_assertions` key in
# `sys.modules`.
addopts = --import-mode=importlib
consider_namespace_packages = true
